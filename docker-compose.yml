# BangSayur — deployment Switch + Mattermost via Docker Compose.
#
# ⚠️  BELUM TERUJI (UNTESTED) — file ini belum pernah dijalankan end-to-end
#     (tidak ada Docker di VM pengembangan). JANGAN jadikan ini jalur
#     reproduksi utama. Jalur yang terverifikasi adalah langkah bare-metal
#     di README.md ("How to run").
#
# Cara pakai (butuh Docker, dengan risiko di atas):
#   cp .env.example .env   # lalu isi password/secret
#   # Build dulu image switch-core secara manual dari repo Switch:
#   #   git clone https://github.com/sandbox-quantum/switch ../switch-src
#   #   docker build -t switch-core:local -f \
#   #     ../switch-src/deploy/local/Dockerfile.switch-core ../switch-src
#   docker compose up -d
#   # setup bridge + user demo: jalankan demo/setup_bridge.sh dengan
#   # SWITCH_URL/MATTERMOST_URL diarahkan ke service compose.
#
# Yang diperbaiki di revisi ini (tetap belum teruji):
# - Dihapus `build: context: ../switch-src` yang tidak ada di repo ini.
#   `switch-core:local` sekarang harus di-build manual (lihat atas).
# - Postgres menjalankan docker/postgres-init/01-mattermost.sh saat
#   pertama kali, yang membuat role `mmuser` + database `mattermost`
#   yang dipakai service mattermost (sebelumnya tidak pernah dibuat,
#   sehingga Mattermost pasti gagal start).

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-switch}
      POSTGRES_USER: ${DB_OWNER:-postgres}
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?set in .env}
      MM_PASSWORD: ${MM_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_OWNER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  switch-core:
    # TIDAK ADA image publik Switch — build manual dulu (lihat header file).
    image: switch-core:local
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-switch_app}
      DB_PASSWORD: ${DB_PASSWORD:?set in .env}
      DB_NAME: ${DB_NAME:-switch}
      DB_OWNER: ${DB_OWNER:-postgres}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?set in .env}
      GATEWAY_ADMIN_EMAIL: ${GATEWAY_ADMIN_EMAIL:-admin@switch.local}
      GATEWAY_ADMIN_PASSWORD: ${GATEWAY_ADMIN_PASSWORD:?set in .env}
      AGENT_REGISTRATION_TOKEN: ${AGENT_REGISTRATION_TOKEN:?set in .env}
      GATEWAY_COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  mattermost:
    image: mattermost/mattermost-team-edition:11.9.0
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mmuser:${MM_PASSWORD:?set in .env}@postgres:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: http://localhost:8065
      MM_SERVICESETTINGS_ENABLEBOTACCOUNTCREATION: "true"
      MM_TEAMSETTINGS_ENABLEOPENSERVER: "true"
      MM_SERVICESETTINGS_ENABLEONBOARDINGFLOW: "false"
      MM_LOGSETTINGS_ENABLEDIAGNOSTICS: "false"
    ports:
      - "127.0.0.1:8065:8065"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
